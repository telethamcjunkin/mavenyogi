sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a Postgres application database.
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 1
          period: day
      loaded_at_field: loaded_at_field
    tables: 
      - name: customers
        description: Raw customer data.
        columns:
          - name: id
            description: Primary key for the raw customers table.
            data_tests:
              - unique
              - not_null
              
      - name: orders
        description: Raw orders data.
        columns:
          - name: id
            description: Primary key for the raw orders table.
            data_tests:
              - unique
              - not_null